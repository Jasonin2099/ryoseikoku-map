name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: pip install fonttools brotli

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test and build
        # Official 京華老宋体 is obtained from the author's WeChat account / netdisk,
        # not from a stable public URL, so CI skips subsetting (system font fallback).
        env:
          FONT_OPTIONAL: "1"
        run: |
          npm test
          npm run build
